# M4/M5: the full stack. `make up` should bring this up green on either
# machine with no change but .env — see IMPLEMENTATION_PLAN_2026-10-03.md
# M4/M5 and ELUMS_TECHNICAL_APPROACH.md §4/§11.6.
#
# Image tags verified against Docker Hub directly Oct 3 2026 (not guessed):
#   pgvector/pgvector:pg18   — Postgres 18 + pgvector, confirmed present
#   valkey/valkey:9.1-alpine — confirmed present
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: elums
      POSTGRES_PASSWORD: elums
      POSTGRES_DB: elums
    # Postgres 18+ images changed their expected mount point: a single
    # mount at /var/lib/postgresql (not .../data) that the entrypoint then
    # manages itself with a major-version subdirectory, to support
    # pg_upgrade --link across container upgrades. Mounting at .../data
    # (the pre-18 convention) makes the entrypoint refuse to start — hit
    # and fixed directly Oct 3 2026 (M4). See
    # https://github.com/docker-library/postgres/pull/1259
    volumes:
      - elums-db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432" # host-side only, for ad-hoc psql; not used by other services
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elums -d elums"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: elums:app
    env_file: .env
    # --reload overrides the Dockerfile's CMD for local dev; the mounted
    # ./:/app volume below means code edits take effect without a rebuild.
    command: ["uvicorn", "elums.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - .:/app
      # M7: `POST /api/songs` writes blobs to `${BLOB_ROOT}` (= /data/blobs)
      # — same host directory the gpu-worker and Caddy already mount.
      - ./data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: elums:app
    env_file: .env
    # `python -m procrastinate`, not the bare `procrastinate` console
    # script: the installed entry point does not add /app (cwd) to
    # sys.path, so it can't import the `elums` package and fails with a
    # generic "Could not load app" — no traceback, hit and fixed directly
    # Oct 3 2026 (M4). `python -m` adds cwd to sys.path[0].
    # `-q default`, not "all queues" (procrastinate's default with no `-q`
    # flag): without this, `worker` raced `gpu-worker` for every
    # `queue="gpu"` job and lost the race by failing instantly — it never
    # imports elums.separation.task (no torch in this image), so the task
    # name is unknown to it. Hit directly Oct 3 2026 (M8): the separation
    # job's status went straight to `failed` with no gpu-worker log line
    # at all. "default" has no tasks yet, but keeps this worker ready for
    # non-GPU tasks later without it ever touching the `gpu` queue.
    command: ["python", "-m", "procrastinate", "--app=elums.jobs.app.app", "worker", "-q", "default"]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - .:/app

  gpu-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: gpu
    image: elums:gpu
    gpus: all
    env_file: .env
    environment:
      - EXPECTED_SM_ARCH=${EXPECTED_SM_ARCH:-sm_86}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # M8: `elums.jobs.gpu_app`, not `elums.jobs.app` — importing that
    # module is what registers the `separate` task (it pulls in
    # elums.separation.task, which needs torch). See that module's
    # docstring.
    command: ["python", "-m", "procrastinate", "--app=elums.jobs.gpu_app.app", "worker", "-q", "gpu"]
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - .:/app
      - ./models:/app/models
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: elums:frontend-dev
    volumes:
      - ./frontend:/app
      - elums-frontend-node-modules:/app/node_modules # bind-mounting ./frontend would otherwise shadow it

  caddy:
    image: caddy:2.11-alpine
    ports:
      - "127.0.0.1:8080:8080" # the ssh -L 8080 tunnel target, see ELUMS_TECHNICAL_APPROACH.md §11.6
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # M7: Caddy serves blob bytes directly off disk (the whole point of
      # the forward_auth + file_server byte path) — read-only, since
      # Caddy never writes a blob, only `api`/`gpu-worker` do. Mounted at
      # /srv/elums-data, not /data: Caddy's own image uses /data
      # internally for TLS/certificate storage, and mounting our volume
      # there collided with it — hit directly Oct 3 2026 (M7):
      # "mkdir /data/caddy: read-only file system".
      - ./data:/srv/elums-data:ro
    depends_on:
      - api
      - frontend

volumes:
  elums-db-data:
  elums-frontend-node-modules:
