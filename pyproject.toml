[project]
name = "elums"
version = "0.1.0"
description = "Elums — social karaoke web app (Smule Labs submission)"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# "core" is config/logging/db/queue — needed by every process (api, worker,
# gpu-worker alike), so both "app" and "gpu" include it rather than each
# process importing elums.config/elums.jobs.app and hitting ImportError.
core = [
    # [asyncio] extra, not bare sqlalchemy: AsyncSession needs `greenlet`,
    # which is not pulled in otherwise — hit directly Oct 3 2026 (M4):
    # ImportError at api startup, "SQLAlchemy asyncio module requires
    # that the Python 'greenlet' library is installed."
    "sqlalchemy[asyncio]==2.1.3",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    # No [psycopg] extra: procrastinate 3.10 depends on psycopg[pool]
    # unconditionally now — verified against PyPI's requires_dist directly
    # Oct 3 2026; the extra name doesn't exist and uv was silently
    # ignoring it (warning, not error) rather than failing the sync.
    "procrastinate==3.10.0",
    # Tue Oct 6 (EC-5, T5): song_embeddings' Vector(512) column type.
    # Core, not gpu-only — api/worker read song_embeddings too (Sunday's
    # recommender), even though only gpu-worker ever writes a vector.
    "pgvector==0.4.2",
]

# "app" stays torch-free so the api/worker image rebuilds fast on every
# code change — see ELUMS_TECHNICAL_APPROACH.md §11.6 and
# IMPLEMENTATION_PLAN_2026-10-03.md M4.
app = [
    { include-group = "core" },
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "argon2-cffi==25.1.0",
    "valkey==6.1.1",
    "email-validator==2.3.0", # pydantic's EmailStr needs this installed explicitly
    # Starlette's UploadFile/Form parsing needs this installed explicitly
    # too (not vendored) — verified directly Oct 3 2026 (M7):
    # ModuleNotFoundError: No module named 'multipart' the moment
    # POST /api/songs received a multipart/form-data request.
    "python-multipart==0.0.32",
]

# "gpu" is the audio/ML stack. Torch is pinned to the cu130 index for both
# machines (§3.2 of the implementation plan) — one wheel yields sm_86
# locally and sm_120 on the VM, verified in M3. Includes "core" too: the
# gpu-worker process still needs elums.config/elums.jobs.app to run tasks.
gpu = [
    { include-group = "core" },
    "torch==2.14.1",
    # audio-separator[cpu]: prefer the CPU-only onnxruntime extra even in the
    # gpu image, per §3.3 — Mel-Band RoFormer is a torch model, and pulling
    # onnxruntime-gpu would add a second, unused CUDA runtime into the process.
    "audio-separator[cpu]==0.47.0",
    # Not a transitive dependency of librosa 1.0.0 despite audio-separator's
    # uvr_lib_v5.spec_utils importing it directly — verified Oct 3 2026
    # (see docs/licensing-audit.md / config/models.yaml EC-5 notes). Must be
    # pinned explicitly or the gpu image crashes on import.
    "audioread>=3.1.0",
    # elums/separation/task.py imports this directly (to read sample_rate/
    # duration off the output stems) — audio-separator already pulls it in
    # transitively, but a module we wrote importing it directly needs its
    # own explicit pin, not a free ride on someone else's dependency.
    "soundfile==0.14.0",
    # Tue Oct 6 (T1/T3): elums/ingest/f0.py, elums/vendor/rmvpe/model.py,
    # and elums/ingest/chart.py all `import numpy` directly — already a
    # transitive pull via librosa/torch, but same explicit-pin convention
    # as soundfile above.
    "numpy==2.3.4",
    # Sun Oct 4 (N1, EC-1): structure/beats/downbeats/sections. Pulls in
    # demucs-infer -> torchaudio>=2.0.0, but the cu130 index tops out at
    # torchaudio 2.11.0 while torch is pinned to 2.14.1 (one-wheel
    # discipline, §3.2 of the Oct 3 plan). Pin torchaudio explicitly to the
    # newest cu130-available build rather than letting it float — verified
    # importable together Oct 4 2026, see PROGRESS.md Day 2 EC-1.
    "all-in-one-infer==3.1.0",
    "torchaudio==2.11.0",
    "librosa==1.0.0",
    # Mon Oct 5 (L1, EC-2): runs the HF-transformers-format Whisper
    # large-v3-turbo checkpoint already on disk at
    # ${MODEL_ROOT}/whisper-large-v3-turbo (NOT CTranslate2 — whisperx was
    # evaluated and rejected, see PROGRESS.md Day 3 EC-1). Pinned
    # explicitly; verified `uv lock` does not move torch/torchaudio.
    "transformers==5.9.0",  # 4.57.0 is yanked on PyPI (setup bug); verified not yanked.
    # Mon Oct 5 (L3, EC-5): hyphenation dictionary for syllable split
    # points. Tri-licensed GPL-2.0/LGPL-2.1/MPL-1.1 — shipped under
    # MPL-1.1, recorded in docs/licensing-audit.md.
    "pyphen==0.17.2",
    # Tue Oct 6 (EC-6): linear probe over WavLM hidden states,
    # scripts/ssl_layer_probe.py (T7, runs on the VM). Pure sklearn
    # logistic regression, no new torch/torchaudio pin.
    "scikit-learn==1.7.2",
]

# "dev" is host-side only — pytest hits the real running compose stack
# through the ssh-tunnel/exposed port (http://localhost:8080), not an
# in-process ASGI transport, so this validates docker-compose.yaml and
# Caddy's reverse_proxy, not just the FastAPI app in isolation. Never
# installed into any image.
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    # Mon Oct 5 (L3): tests/test_lyrics.py exercises elums/ingest/syllables.py
    # on the host, same as elums/ingest/vad.py's deterministic pieces would
    # if they didn't also need librosa (gpu-only) at module scope — pyphen
    # is pure Python, no GPU/torch dependency, safe in "dev" too.
    "pyphen==0.17.2",
    # Tue Oct 6 (T2): tests/test_notes.py exercises elums/ingest/notes.py's
    # deterministic segmentation on synthetic F0 arrays — numpy only, no
    # torch/librosa, same "deterministic layers only" precedent.
    "numpy==2.3.4",
    # For tests/test_auth.py's DB-level invariants (no plaintext token at
    # rest, exactly one session row per login, logout deletes the row) —
    # connects to the db:5433 host-port exposed for "ad-hoc psql" in
    # docker-compose.yaml. Never installed into any image.
    "psycopg[binary]==3.3.6",
]

[tool.pytest.ini_options]
# `elums` is never actually `pip install`ed anywhere (not even in the
# Docker images — it works there by accident of uvicorn's `app_dir`
# adding cwd to sys.path). Pytest's default "rootless" import mode adds
# only the test file's own directory to sys.path, not the repo root, so
# tests/test_blobstore.py's `from elums.blobs.store import ...` failed
# with "No module named 'elums'" until this was added — hit directly
# Oct 3 2026 (M7), the first unit test (not hitting the live stack over
# HTTP) in the suite.
pythonpath = ["."]
# N4 (Oct 4): without this, pytest's default collection walks the whole
# repo, including ./models/hf-cache — populated by N1's torch.hub/HF
# downloads — whose cache layout trips Windows ("WinError 1920") when
# pytest's directory walk stats entries it has no business visiting.
# Scoping to tests/ is also just correct regardless of that bug.
testpaths = ["tests"]
markers = [
    "gpu: requires a running gpu-worker with the separation checkpoint on disk (tests/test_separation.py, tests/test_structure.py)",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
